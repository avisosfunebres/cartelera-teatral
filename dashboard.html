<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Privado - Formularios</title>
    
    <style>
        /* Estilos Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f0f2f5; 
            color: #1a1a1a;
            padding: 20px;
        }

        /* 1. Protección contra parpadeo visual */
        #protectedContent { 
            display: none; 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
        }

        /* Barra superior de navegación */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        h2 { font-size: 20px; font-weight: 600; color: #333; }

        /* Botón de Cerrar Sesión */
        .logout-btn { 
            padding: 8px 16px; 
            background: #dc3545; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: #c82333; }

        /* Contenedor de cada Formulario */
        .form-card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
        }
        .form-card h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #4a4a4a;
        }

        /* Ajustes para pantallas chicas (Celulares) */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 12px 15px; margin-bottom: 15px; }
            h2 { font-size: 16px; }
            .logout-btn { padding: 6px 12px; font-size: 12px; }
            .form-card { padding: 15px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="card" style="display: flex; justify-content: space-between; align-items: center;">
    <!-- Aquí se inyectará el saludo de bienvenida -->
    <h1 id="saludo-usuario" style="margin: 0; color: #333; font-size: 24px;">Cargando...</h1>
    
    <!-- Botón opcional para cerrar sesión de forma segura -->
    <button onclick="cerrarSesion()" class="btn-cancel" style="padding: 8px 12px;">Cerrar Sesión</button>
</div>



<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // === REEMPLAZÁ CON TUS MISMAS CREDENCIALES REALES ===
    const firebaseConfig = {
	  apiKey: "AIzaSyAn58MK-9KuijpbjC5tC2Z7MCXKzKnvGX8",
	  authDomain: "cartelera-teatral.firebaseapp.com",
	  projectId: "cartelera-teatral",
	  storageBucket: "cartelera-teatral.firebasestorage.app",
	  messagingSenderId: "371703320749",
	  appId: "1:371703320749:web:be24b94546544066c97624",
	  measurementId: "G-BJ6HKSHXXP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // CONTROL DE SESIÓN Y SALUDO PERSONALIZADO
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // El usuario ingresó correctamente. Extraemos su correo (o su nombre si lo tiene configurado)
            const identificador = user.displayName || user.email;
            
            // Cambiamos el texto de la pantalla por el saludo real
            document.getElementById('saludo-usuario').innerText = `¡Bienvenido, ${identificador}! 👋`;
            
            // Cargamos sus obras de teatro desde Firestore
            obtenerObrasDelUsuario(user.uid);
        } else {
            // Si no hay sesión iniciada, lo mandamos de vuelta al login
            window.location.href = "index.html";
        }
    });

    // Función global para que el botón HTML de cerrar sesión funcione desde un módulo
    window.cerrarSesion = function() {
        signOut(auth).then(() => {
            window.location.href = "index.html";
        }).catch((error) => console.error("Error al cerrar sesión:", error));
    }

</script>


</body>
</html>
