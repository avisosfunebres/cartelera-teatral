<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Privado - Formularios</title>
    
    <!-- Script oficial de Tally para manejar la carga dinámica de formularios -->
    <script src="https://tally.so"></script>
    
    <style>
        /* Estilos Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f0f2f5; 
            color: #1a1a1a;
            padding: 20px;
        }

        /* 1. Protección contra parpadeo visual */
        #protectedContent { 
            display: none; 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
        }

        /* Barra superior de navegación */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        h2 { font-size: 20px; font-weight: 600; color: #333; }

        /* Botón de Cerrar Sesión */
        .logout-btn { 
            padding: 8px 16px; 
            background: #dc3545; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: #c82333; }

        /* Contenedor de cada Formulario */
        .form-card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
        }
        .form-card h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #4a4a4a;
        }

        /* Contenedor Responsive para el Iframe de Tally */
        .tally-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        iframe { 
            width: 100%; 
            height: 600px; /* Altura sugerida, Tally la ajustará si puede */
            border: none; 
        }

        /* Ajustes para pantallas chicas (Celulares) */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 12px 15px; margin-bottom: 15px; }
            h2 { font-size: 16px; }
            .logout-btn { padding: 6px 12px; font-size: 12px; }
            .form-card { padding: 15px; margin-bottom: 15px; }
            iframe { height: 500px; } /* Ajuste de altura en móviles */
        }
    </style>
</head>
<body>

    <!-- Contenedor protegido: Nace oculto y solo se muestra si Firebase aprueba al usuario -->
    <div id="protectedContent">
        
        <!-- Barra de navegación con botón de salida -->
        <div class="header">
            <h2>Panel de Formularios</h2>
            <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
        </div>

        <!-- FORMULARIO 1 DE TALLY -->
        <div class="form-card">
            <h3>Formulario Principal</h3>
            <div class="tally-wrapper">
                <!-- === REEMPLAZÁ LA URL DE ABAJO POR TU ENLACE DE TALLY === -->
                <iframe data-tally-src="https://tally.so" title="Formulario Tally 1"></iframe>
            </div>
        </div>

        <!-- FORMULARIO 2 DE TALLY (Podés duplicar este bloque si necesitás más) -->
        <div class="form-card">
            <h3>Encuesta Adicional</h3>
            <div class="tally-wrapper">
                <!-- === REEMPLAZÁ LA URL DE ABAJO POR TU SEGUNDO ENLACE DE TALLY === -->
                <iframe data-tally-src="https://tally.so" title="Formulario Tally 2"></iframe>
            </div>
        </div>

    </div>

    <!-- Lógica de Control de Acceso con Firebase -->
<!-- SDK de Firebase Clásico v8 -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // === REEMPLAZÁ CON TUS MISMAS CREDENCIALES REALES ===
    const firebaseConfig = {
	  apiKey: "AIzaSyAn58MK-9KuijpbjC5tC2Z7MCXKzKnvGX8",
	  authDomain: "cartelera-teatral.firebaseapp.com",
	  projectId: "cartelera-teatral",
	  storageBucket: "cartelera-teatral.firebasestorage.app",
	  messagingSenderId: "371703320749",
	  appId: "1:371703320749:web:be24b94546544066c97624",
	  measurementId: "G-BJ6HKSHXXP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const contentDiv = document.getElementById('protectedContent');

    // Control de sesión clásico
    auth.onAuthStateChanged((user) => {
        if (user) {
            contentDiv.style.display = 'block';
            if (window.Tally) {
                window.Tally.loadEmbeds(); 
            }
        } else {
            window.location.href = 'index.html';
        }
    });

    // Cerrar sesión
    document.getElementById('logoutBtn').addEventListener('click', () => {
        auth.signOut().then(() => {
            window.location.href = 'index.html';
        });
    });
</script>



</body>
</html>
