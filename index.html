<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <style>
        /* Estilos Base y Centrado Absoluto */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;  
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: #f0f2f5; 
            padding: 20px;
        }

        /* Tarjeta de Autenticación Responsive */
        .auth-container { 
            background: white; 
            padding: 35px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 400px; /* Tamaño ideal en escritorio */
            transition: all 0.3s ease;
        }

        /* Título Principal */
        h2 { 
            text-align: center; 
            margin-bottom: 24px; 
            color: #1a1a1a; 
            font-size: 24px;
            font-weight: 600;
        }

        /* Campos de Entrada */
        .input-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #4a4a4a;
            font-weight: 500;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; /* Evita el zoom automático molesto en iPhones al hacer foco */
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus { 
            border-color: #007bff; 
            background: white;
        }

        /* Botón de Acción */
        button { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            border: none; 
            color: white; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            margin-top: 10px; 
            transition: background 0.2s ease;
        }
        button:hover { background: #0056b3; }
        button:active { transform: scale(0.98); }

        /* Enlace de Alternancia */
        .toggle-link { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 14px; 
            color: #007bff; 
            cursor: pointer; 
            user-select: none;
        }
        .toggle-link:hover { text-decoration: underline; }

        /* Mensajes de Alerta */
        .alert { 
            padding: 10px;
            border-radius: 6px;
            font-size: 14px; 
            text-align: center; 
            margin-top: 15px; 
            display: none; 
            line-height: 1.4;
        }
        .error { background: #ffe3e3; color: #dc3545; border: 1px solid #fbc4c4; }
        .success { background: #e3f9e5; color: #28a745; border: 1px solid #c7eed1; }

        /* Ajustes específicos para pantallas muy chicas (Celulares antiguos) */
        @media (max-width: 360px) {
            .auth-container { padding: 25px 15px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Título que cambia según la acción -->
        <h2 id="login-form">Iniciar Sesión</h2>
        
        <form id="authForm" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="submitBtn">Ingresar</button>
        </form>

        <!-- Contenedores para mensajes informativos -->
        <div id="errorMessage" class="alert error"></div>
        <div id="successMessage" class="alert success"></div>

        <!-- Enlace interactivo para cambiar de modo -->
        <div id="toggleAuth" class="toggle-link">¿No tenés cuenta? Creá una gratis aquí</div>
    </div>



	<!-- 1. Cargar los scripts con el atributo type="module" -->
<script type="module">
    // 2. Importar los módulos específicos desde la CDN oficial de Firebase v10
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 3. Tu configuración de Firebase
    const firebaseConfig = {
	  apiKey: "AIzaSyAn58MK-9KuijpbjC5tC2Z7MCXKzKnvGX8",
	  authDomain: "cartelera-teatral.firebaseapp.com",
	  projectId: "cartelera-teatral",
	  storageBucket: "cartelera-teatral.firebasestorage.app",
	  messagingSenderId: "371703320749",
	  appId: "1:371703320749:web:be24b94546544066c97624",
	  measurementId: "G-BJ6HKSHXXP"
    };

    // 4. Inicializar los servicios
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 5. Capturar el formulario y procesar el Login
    const formLogin = document.getElementById('authForm'); // Reemplaza por el ID real de tu <form>
    
    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value; // Reemplaza por tu ID de email
        const password = document.getElementById('password').value; // Reemplaza por tu ID de contraseña

        try {
            // Función nativa de Firebase para loguear
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            console.log("Usuario logueado:", userCredential.user);
            
            // Redireccionar al dashboard si todo sale bien
            window.location.href = "dashboard.html";
        } catch (error) {
            console.error("Error al iniciar sesión:", error.code, error.message);
            alert("Credenciales incorrectas o error de conexión.");
        }
    });
</script>

</body>
</html>
